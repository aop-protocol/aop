[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aop"
version = "0.1.0-alpha"
description = "Universal observability protocol for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Ajit Singh", email = "asing349@ucr.edu"}
]
keywords = ["observability", "agents", "ai", "mcp", "a2a", "ap2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "types-psycopg2>=2.9.0",
    "bandit>=1.7",
]
postgresql = [
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/aop-protocol/aop"
Documentation = "https://docs.aop-protocol.org"
Repository = "https://github.com/aop-protocol/aop"
Issues = "https://github.com/aop-protocol/aop/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aop*"]
exclude = ["data*", "tests*", "docs*", "*.egg-info"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=aop --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true